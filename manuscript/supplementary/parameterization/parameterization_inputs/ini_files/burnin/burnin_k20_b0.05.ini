## NEMO-AGE CONFIG FILE (template)

## ----------------------------
## SIMULATION
## ----------------------------
run_mode overwrite
random_seed 4092026
root_dir supplementary/results/burnin/k20_b0.05
filename burnin_k20_b0.05
logfile burnin_k20_b0.05_log

replicates 1
generations 500

## ----------------------------
## POPULATION INITIALIZATION
## ----------------------------
patch_number 625
patch_nbfem 20
patch_nbmal 0

# Stage initialization matrix (rows = patches, cols = stage0..stage3)
patch_init_stage_size &supplementary/input_files/patch_init_stage_size/patch_init_stage_size_burnin_sylv.txt

## ----------------------------
## AGE STRUCTURE + TRANSITION
## ----------------------------
# Age boundaries for each stage (example used in your project)
pop_age_structure {{0,1,4,40}}

# Transition matrix between stages (rows = from-stage, cols = to-stage)
# (example from your existing beech setups; keep unless you intentionally change it)
pop_transition_by_age
pop_transition_matrix {{0,	0,	0,	1000}    	
                      {0.3,	0,	0,	0}		
                      {0,	0.7,	0,	0}		
                      {0,	0,	1,	0.97}} 

## ----------------------------
## QUANTITATIVE TRAIT = SPECIES IDENTITY
## ----------------------------
quanti_traits 1
quanti_loci 10
quanti_allele_model diallelic_HC
quanti_allele_value {{0.05}}

quanti_init_freq &supplementary/input_files/quanti_init_freq/quanti_init_file_burnin_sylv.txt

quanti_mutation_rate 0
quanti_mutation_variance 0

## ----------------------------
## LIFE CYCLE EVENTS
## ----------------------------
quanti_init        0
breed_disperse     1
seed_disperse      2
regulation         3
save_stats         4
aging_multi        5
save_files 6

## ----------------------------
## SEED DISPERSAL
## ----------------------------
seed_disperse_connectivity_matrix &supplementary/input_files/disperse/Seed_connectivity_matrix_d5.txt
seed_disperse_reduced_matrix &supplementary/input_files/disperse/Seed_rate_matrix_d5.txt

## ----------------------------
## POLLEN DISPERSAL
## ----------------------------
breed_disperse_dispersing_sex male
breed_disperse_connectivity_matrix_mal &supplementary/input_files/disperse/Pollen_connectivity_matrix_d30.txt
breed_disperse_reduced_matrix_mal &supplementary/input_files/disperse/Pollen_rate_matrix_d30.txt
breed_disperse_connectivity_matrix_fem matrix(q(seq(1,625,1)), 625, 1)
breed_disperse_reduced_matrix_fem matrix(q(rep(1,625)), 625, 1)

## ----------------------------
## MATING SYSTEM
## ----------------------------
mating_system 4
mating_proportion 0.005

## ----------------------------
## REGULATION (density dependence)
## ----------------------------
regulation_by_competition 0.05
regulation_by_competition_model Beverton-Holt
regulation_by_competition_affected_age {{1,2}}
regulation_by_competition_count_age_flag 4294967295
regulation_carrying_capacity

