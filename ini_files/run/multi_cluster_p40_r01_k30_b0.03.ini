## NEMO-AGE CONFIG FILE (template)

## ----------------------------
## SIMULATION
## ----------------------------
run_mode overwrite
random_seed 9999
root_dir results/multi_cluster/p40/r01/run
filename multi_cluster_p40_r01_k30_b0.03
logfile multi_cluster_p40_r01_k30_b0.03_log

replicates 30
generations 500

## ----------------------------
## POPULATION INITIALIZATION
## ----------------------------
patch_number 625
patch_nbfem 30
patch_nbmal 0

# Stage initialization matrix (rows = patches, cols = stage0..stage3)
patch_init_stage_size &input_files/patch_init_stage_size/patch_init_stage_size_multi_cluster_p40_r01.txt

## ----------------------------
## AGE STRUCTURE + TRANSITION
## ----------------------------
# Age boundaries for each stage (example used in your project)
pop_age_structure {{0,1,4,40}}

# Transition matrix between stages (rows = from-stage, cols = to-stage)
# (example from your existing beech setups; keep unless you intentionally change it)
pop_transition_by_age
pop_transition_matrix {{0,	0,	0,	1000}    	
				              {0.3,	0,	0,	0}		
                      {0,	0.7,	0,	0}		
                      {0,	0,	1,	0.97}} 

## ----------------------------
## QUANTITATIVE TRAIT = SPECIES IDENTITY
## ----------------------------
quanti_traits 1
quanti_loci 10
quanti_allele_model diallelic_HC
quanti_allele_value {{0.05}}

quanti_init_freq &input_files/quanti_init_freq/quanti_init_file_multi_cluster_p40_r01.txt

quanti_mutation_rate 0
quanti_mutation_variance 0

## ----------------------------
## LIFE CYCLE EVENTS
## ----------------------------
quanti_init        0
breed_disperse     1
seed_disperse      2
regulation         3
save_stats         4
aging_multi        5
save_files         6

## ----------------------------
## SEED DISPERSAL
## ----------------------------
seed_disperse_connectivity_matrix &input_files/disperse/Seed_connectivity_matrix_d5.txt
seed_disperse_reduced_matrix &input_files/disperse/Seed_rate_matrix_d5.txt

## ----------------------------
## POLLEN DISPERSAL
## ----------------------------
breed_disperse_dispersing_sex male
breed_disperse_connectivity_matrix_mal &input_files/disperse/Pollen_connectivity_matrix_d30.txt
breed_disperse_reduced_matrix_mal &input_files/disperse/Pollen_rate_matrix_d30.txt
breed_disperse_connectivity_matrix_fem matrix(q(seq(1,625,1)), 625, 1)
breed_disperse_reduced_matrix_fem matrix(q(rep(1,625)), 625, 1)

## ----------------------------
## MATING SYSTEM
## ----------------------------
mating_system 4
mating_proportion 0.005

## ----------------------------
## REGULATION (density dependence)
## ----------------------------
regulation_by_competition 0.03
regulation_by_competition_model Beverton-Holt
regulation_by_competition_affected_age {{1,2}}
regulation_by_competition_count_age_flag 4294967295
regulation_carrying_capacity

## ----------------------------
## OUTPUTS
## ----------------------------

stat pop pop.patch
stat_log_time {{2,50,100,150,200,250,300,350,400,450,500}}

quanti_output
quanti_logtime {{2,50,100,150,200,250,300,350,400,450,500}}
quanti_dir quanti
